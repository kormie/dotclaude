name: Devenv shell

on:
  pull_request:
    paths:
      - ".envrc"
      - ".python-version"
      - "devenv.lock"
      - "devenv.nix"
      - "devenv.yaml"
      - "requirements.txt"
      - ".github/workflows/devenv.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Build and test the development shell
        run: devenv test
