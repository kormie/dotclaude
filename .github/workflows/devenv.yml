name: Devenv

on:
  # Run the aggregate QA suite for every pull request. Do not add path filters
  # without measured cost data, complete dependency coverage, and a scheduled
  # unfiltered run: a skipped workflow cannot satisfy the required Linux check.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: devenv / Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Run aggregate repository QA
        run: devenv tasks run ci:all

  macos:
    name: devenv / macOS (advisory)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Run aggregate repository QA
        run: devenv tasks run ci:all
