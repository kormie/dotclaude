name: Devenv

on:
  # Run the aggregate QA suite for every pull request. Do not add path filters
  # without measured cost data, complete dependency coverage, and a scheduled
  # unfiltered run: a skipped workflow cannot satisfy the required Linux check.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pin the devenv release instead of taking whatever nixpkgs-unstable has
  # today. The devenv CLI embeds its own Nix evaluator; when that embedded Nix
  # is older than the daemon installed by install-nix-action, evaluation can
  # fail intermittently with "path '/nix/store/...' is not valid"
  # (cachix/devenv#3064). devenv v2.3 bundles Nix 2.35, matching the runner.
  DEVENV_VERSION: v2.3

jobs:
  linux:
    name: devenv / Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add "github:cachix/devenv/${DEVENV_VERSION}"
      # devenv.nix wires ci:all before devenv:enterTest, so this validates both
      # the aggregate repository tasks and the development shell itself.
      - name: Test development shell and run aggregate repository QA
        run: devenv test

  macos:
    name: devenv / macOS (advisory)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add "github:cachix/devenv/${DEVENV_VERSION}"
      - name: Test development shell and run aggregate repository QA
        run: devenv test
