name: Flipper asset pack

# Compiles the source PNG pack in flipper/ into the on-device .bm/.bmx format
# and publishes a ready-to-install zip you can drop onto the SD card via
# qFlipper's file manager or the Flipper mobile app.
#
#   - every push / PR touching flipper/**  -> downloadable Actions artifact
#   - push a tag like `flipper-v1`          -> attaches the zip to a GitHub Release
#                                              (easiest to grab from the iOS app)

on:
  push:
    branches: ["**"]
    paths: ["flipper/**", ".github/workflows/flipper-asset-pack.yml"]
    tags: ["flipper-v*"]
  pull_request:
    paths: ["flipper/**", ".github/workflows/flipper-asset-pack.yml"]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the Release on tag pushes

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install Pillow heatshrink2

      - name: Regenerate source art (verifies the generator runs)
        run: python3 flipper/generate_assets.py

      - name: Pack to device format
        # Pinned to the firmware tag so the packed output matches the device.
        env:
          MOMENTUM_REF: mntm-012
        run: python3 flipper/pack.py

      - name: Assemble installable zip
        run: |
          cd flipper/dist
          cp ../README.md kormie/INSTALL.md
          zip -r ../../kormie-asset-pack.zip kormie
          cd ../..
          unzip -l kormie-asset-pack.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kormie-asset-pack
          path: flipper/dist/kormie
          if-no-files-found: error

      - name: Attach to Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/flipper-v')
        uses: softprops/action-gh-release@v2
        with:
          files: kormie-asset-pack.zip
          body: |
            `kormie` Flipper Zero asset pack — packed to the on-device format
            against firmware `${{ env.MOMENTUM_REF || 'mntm-012' }}`.

            **Install:** download `kormie-asset-pack.zip`, unzip, and copy the
            `kormie` folder into `/ext/asset_packs/` on the SD card (qFlipper
            File Manager, the Flipper mobile app, or a card reader). Then select
            it in Settings → Momentum → Asset Pack and reboot.
